services:
  rule-engine:
    build:
      context: .
      dockerfile: services/rule-engine/Dockerfile
    ports:
      - "8070:8070"
    volumes:
      - ./vault:/app/vault
    restart: unless-stopped

  crewai-service:
    build:
      context: .
      dockerfile: services/crewai-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
    restart: unless-stopped

  memory-service:
    build:
      context: .
      dockerfile: services/memory-service/Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - memory_data:/app/data
    restart: unless-stopped

volumes:
  memory_data:
