name: Rule change
description: Yeni CRM status kuralı veya yanlış sınıflandırma düzeltmesi
title: "rule: "
labels: ["rule-change"]
body:
  - type: markdown
    attributes:
      value: |
        Telegram’da gördüğünüz Wrong/Manual hatayı buraya yazın.
        Akış: Issue → vault + golden + kod → CI → n8n Memory Match.
  - type: input
    id: account
    attributes:
      label: Account no (örnek lead)
      placeholder: "ACC89106"
    validations:
      required: true
  - type: input
    id: crm_status
    attributes:
      label: CRM customer status (şu anki)
      placeholder: "Call Again"
    validations:
      required: true
  - type: textarea
    id: comments
    attributes:
      label: last 10 comments (kopyala-yapıştır)
      description: Mümkünse tarihli satırları olduğu gibi yapıştırın.
    validations:
      required: true
  - type: input
    id: expect_status
    attributes:
      label: Olması gereken Suggested Status
      placeholder: "Call Again"
    validations:
      required: true
  - type: dropdown
    id: expect_validation
    attributes:
      label: Olması gereken Validation Result
      options:
        - Correct
        - Wrong
        - Manual Check
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Kısa gerekçe (iş kuralı)
      placeholder: "Call Again, 5 distinct NA gününden az → status korunur"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Sonra yapılacaklar (agent/PR)
      options:
        - label: vault/rules notu
        - label: evals/golden_leads.jsonl satırı
        - label: crm_classify.py (+ gerekirse Memory Match)
        - label: CI yeşil
        - label: Canlı n8n sync + Telegram’da account kontrolü
